<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="hep">
  <!--
    Favicon: der blaue Punkt der hep-Bildmarke. Die Wortmarke «hep» bleibt
    weg — bei 16 px Kantenlänge wäre die Schrift nur noch Grieselei.

    Die Farbe #004078 ist aus public/hep-logo.jpg ausgelesen (häufigster
    dunkler Farbwert), nicht geschätzt.

    Next.js zieht diese Datei über die Dateikonvention `app/icon.svg`
    automatisch als Favicon ein; layout.tsx bleibt unangetastet.

    Im dunklen Fenstermodus hellt der Punkt auf, sonst verschwände
    Dunkelblau auf dunkelgrauem Tab-Hintergrund. Chrome, Firefox und Edge
    werten diese Abfrage in SVG-Favicons aus.
  -->
  <style>
    .punkt { fill: #004078; }
    @media (prefers-color-scheme: dark) {
      .punkt { fill: #6fa8dc; }
    }
  </style>
  <circle class="punkt" cx="16" cy="16" r="15" />
</svg>
